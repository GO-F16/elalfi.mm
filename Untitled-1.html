<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elalfi_بيسأل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Formspree Ajax -->
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --brand-color: #ff2a5f;
            --text-color: #590d22;
            --muted-color: #800f2f;
            --border-color: rgba(255, 42, 95, 0.2);
        }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 30px 25px;
            border-radius: 28px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(128, 15, 47, 0.2);
            position: relative;
            box-sizing: border-box;
        }
        
        h3 {
            margin: 10px 0 8px 0;
            font-size: 20px;
            color: var(--brand-color);
            font-weight: 800;
            text-align: center;
            line-height: 1.4;
        }

        p.subtitle {
            color: var(--muted-color);
            font-size: 13px;
            margin: 0 auto 20px auto;
            text-align: center;
            line-height: 1.4;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: #ffffff;
            border: 2px solid #ffccd5;
            color: var(--text-color);
            padding: 12px 10px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.1);
            text-align: center;
        }

        .btn:hover {
            background: var(--brand-color);
            color: #ffffff;
            border-color: var(--brand-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 42, 95, 0.3);
        }

        .btn.selected {
            background: var(--brand-color);
            color: #ffffff;
            border-color: var(--brand-color);
        }

        .btn-full {
            grid-column: span 2;
        }

        .back-container {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 5px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--muted-color);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0;
        }

        .back-btn:hover {
            color: var(--brand-color);
        }

        .summary-box {
            background: #fff0f3;
            border: 2px dashed #ffccd5;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
            font-size: 14px;
            line-height: 1.6;
        }

        .summary-box p {
            margin: 6px 0;
            color: var(--text-color);
        }

        .summary-box span {
            font-weight: bold;
            color: var(--brand-color);
        }

        .timer-box {
            background: #fff0f3;
            border: 2px solid var(--brand-color);
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            text-align: center;
        }

        .timer-display {
            font-size: 28px;
            font-weight: bold;
            color: var(--brand-color);
            margin: 10px 0;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: #fff0f3;
            border: 2px solid #ffccd5;
            border-radius: 14px;
            padding: 14px;
            color: var(--text-color);
            font-family: 'Cairo', Tahoma, sans-serif;
            box-sizing: border-box;
            margin-top: 10px;
            font-size: 15px;
            text-align: center;
        }
        textarea {
            resize: none;
            height: 100px;
            text-align: right;
        }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--brand-color);
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- المحتوى الديناميكي -->
    </div>

    <script>
        let answers = { food: [], drink: [], movieType: '' };
        let historyStack = [];
        let currentStepId = 'start';
        let countdownInterval = null;

        function goToStep(step, pushHistory = true) {
            if (pushHistory && currentStepId) {
                historyStack.push(currentStepId);
            }
            currentStepId = step;
            renderStep(step);
        }

        function goBackWithConfirmation() {
            let userConfirmed = confirm("⚠️ أسف وعيب في حقك.. هل متأكد إنك عاوز تاعتذر وتنسحب وترجع في كلامك؟ لازم تضغط موافق للتأكيد!");
            if (userConfirmed) {
                if (historyStack.length > 0) {
                    let prevStep = historyStack.pop();
                    currentStepId = prevStep;
                    renderStep(prevStep, false);
                }
            }
        }

        function renderStep(step) {
            const app = document.getElementById('app');
            
            // إيقاف أي عداد قديم لو موجود عند الانتقال
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            let backHtml = (historyStack.length > 0 && step !== 'summary') ? `
                <div class="back-container">
                    <button class="back-btn" onclick="goBackWithConfirmation()"><i class="fa-solid fa-arrow-right"></i> انا عيله ورجعت في كلامي🗿</button>
                </div>` : '';

            if (step === 'start') {
                historyStack = [];
                app.innerHTML = `
                    ${backHtml}
                    <h3><i class="fa-solid fa-wand-magic-sparkles"></i> أول سؤال ... مش عايزة تطلعي؟</h3>
                    <p class="subtitle">مفيش وقت للتفكير .. انجزي بقولك 🔪</p>
                    <div class="options">
                        <button class="btn btn-full" onclick="goToStep('time')">1- <i class="fa-solid fa-heart" style="color: #ff2a5f;"></i> طبعًا هو انا اطول ي هندسة</button>
                        <button class="btn btn-full" onclick="alert('كام مره قولت مفيش هنا حرية آراء 😒 (شتيمة وحشة)')">2- 🐼 لا عشان انا غبية</button>
                    </div>
                `;
            } else if (step === 'time') {
                app.innerHTML = `
                    ${backHtml}
                    <h3><i class="fa-solid fa-clock"></i> تحبي امتى ي هانم</h3>
                    <p class="subtitle">🌝 يارب ابوكي يسبنا في حالنا</p>
                    <div class="options">
                        <button class="btn" onclick="answers.time='1:00 الظهر'; goToStep('place')"><i class="fa-solid fa-sun" style="color: #ffa500;"></i> 1:00 الظهر</button>
                        <button class="btn" onclick="answers.time='3:30 العصر'; goToStep('place')"><i class="fa-solid fa-cloud-sun" style="color: #ff7b00;"></i> 3:30 العصر</button>
                        <button class="btn" onclick="answers.time='8:00 المغرب'; goToStep('place')"><i class="fa-solid fa-moon" style="color: #4361ee;"></i> 8:00 المغرب</button>
                        <button class="btn" onclick="answers.time='9:30 بالليل'; goToStep('place')"><i class="fa-solid fa-star" style="color: #f72585;"></i> 9:30 بالليل ودي صياعة🕵️‍♀️</button>
                    </div>
                `;
            } else if (step === 'place') {
                app.innerHTML = `
                    ${backHtml}
                    <h3><i class="fa-solid fa-location-dot"></i> الفقرة الأصعب تحبي تروحي فين؟</h3>
                    <p class="subtitle">اختاري المكان بحب وشغف..</p>
                    <div class="options">
                        <button class="btn" onclick="checkPlace('باريس')"><i class="fa-solid fa-plane" style="color: #00b4d8;"></i> باريس</button>
                        <button class="btn" onclick="checkPlace('مصر')"><i class="fa-solid fa-landmark" style="color: #e63946;"></i> مصر المحروسة</button>
                        <button class="btn" onclick="checkPlace('المانيا')"><i class="fa-solid fa-city" style="color: #8338ec;"></i> ألمانيا</button>
                        <button class="btn" onclick="checkPlace('تركيا')"><i class="fa-solid fa-tree" style="color: #2b9348;"></i> تركيا</button>
                    </div>
                `;
            } else if (step === 'food') {
                app.innerHTML = `
                    ${backHtml}
                    <h3>تأكلي إي ي هانم دا ربنا دخل راجل الجنة ف كلب</h3>
                    <p class="subtitle" style="font-size: 11px;">(اختيارين على الأقل)</p>
                    <div class="options" id="foodOptions">
                        <button class="btn ${answers.food.includes('سوشي') ? 'selected':''}" onclick="toggleFood(this, 'سوشي')">🍣 سوشي</button>
                        <button class="btn ${answers.food.includes('برجر') ? 'selected':''}" onclick="toggleFood(this, 'برجر')">🍔 برجر</button>
                        <button class="btn ${answers.food.includes('شاورما') ? 'selected':''}" onclick="toggleFood(this, 'شاورما')">🌯 شاورما</button>
                        <button class="btn ${answers.food.includes('بيتزا') ? 'selected':''}" onclick="toggleFood(this, 'بيتزا')">🍕 بيتزا</button>
                        <button class="btn ${answers.food.includes('فرايد تشيكن') ? 'selected':''}" onclick="toggleFood(this, 'فرايد تشيكن')">🍗 فرايد تشيكن</button>
                        <button class="btn ${answers.food.includes('مشاوي') ? 'selected':''}" onclick="toggleFood(this, 'مشاوي')">🍢 مشاوي</button>
                        <button class="btn ${answers.food.includes('كشري') ? 'selected':''}" onclick="toggleFood(this, 'كشري')">🍜 كشري</button>
                        <button class="btn ${answers.food.includes('فطير') ? 'selected':''}" onclick="toggleFood(this, 'فطير')">🥧 فطير</button>
                    </div>
                    <button class="btn btn-full" style="margin-top: 15px; background: var(--brand-color); color: #fff;" onclick="validateFood()">تأكيد الأكل 🚀</button>
                `;
            } else if (step === 'drink') {
                app.innerHTML = `
                    ${backHtml}
                    <h3>أكلنا يبقا لازم نحلي بس لا احنا هنشرب شوفي هتروي نفسك ب إي</h3>
                    <p class="subtitle" style="font-size: 11px;">اختاري مشروب واحد يروي قلبك</p>
                    <div class="options">
                        <button class="btn ${answers.drink.includes('عصير فريش') ? 'selected':''}" onclick="toggleDrink(this, 'عصير فريش')">🍹 عصير فريش</button>
                        <button class="btn ${answers.drink.includes('ايس كوفي') ? 'selected':''}" onclick="toggleDrink(this, 'ايس كوفي')">🧊 ايس كوفي</button>
                        <button class="btn ${answers.drink.includes('شاي عشان نحبس') ? 'selected':''}" onclick="toggleDrink(this, 'شاي عشان نحبس')">🍵 شاي عشان نحبس</button>
                        <button class="btn ${answers.drink.includes('ميلك شيك') ? 'selected':''}" onclick="toggleDrink(this, 'ميلك شيك')">🥛 ميلك شيك</button>
                        <button class="btn ${answers.drink.includes('هوت شوكلت') ? 'selected':''}" onclick="toggleDrink(this, 'هوت شوكلت')">🍫 هوت شوكلت</button>
                        <button class="btn ${answers.drink.includes('ازوزه') ? 'selected':''}" onclick="toggleDrink(this, 'ازوزه')">🥤 ازوزه</button>
                    </div>
                    <button class="btn btn-full" style="margin-top: 15px; background: var(--brand-color); color: #fff;" onclick="validateDrink()">متحرمش منك ي دكري</button>
                `;
            } else if (step === 'cinema') {
                app.innerHTML = `
                    ${backHtml}
                    <h3><i class="fa-solid fa-film"></i> هديلك شرف انك تدخلي سينما مع البشمهندس محمد الألفي</h3>
                    <p class="subtitle">اختيار السينما إلزامي لعيونك!</p>
                    <div class="options">
                        <button class="btn btn-full" onclick="goToStep('movie_choice')"><i class="fa-solid fa-face-grin-hearts" style="color: #ff2a5f;"></i> ربنا على الظالم موافقة</button>
                        <button class="btn btn-full" onclick="alert('❌ عيب عليكي.. دا السينما من غيرك متسواش! اختاري حالا 😉')" style="opacity: 0.6;"><i class="fa-solid fa-lock"></i> لا (مقفول)</button>
                    </div>
                `;
            } else if (step === 'movie_choice') {
                app.innerHTML = `
                    ${backHtml}
                    <h3><i class="fa-solid fa-clapperboard"></i> اختاري نوع الفيلم اللي هنشوفه</h3>
                    <p class="subtitle">حددي السهرة هتبقى إزاي:</p>
                    <div class="options">
                        <button class="btn" onclick="handleMovieSelection('رومنسي')">❤️ فيلم رومنسي</button>
                        <button class="btn" onclick="handleMovieSelection('رعب')">👻 فيلم رعب</button>
                        <button class="btn" onclick="handleMovieSelection('كومدي')">😂 فيلم كومدي</button>
                        <button class="btn" onclick="handleMovieSelection('انميشن')">🦄 انميشن</button>
                    </div>
                `;
            } else if (step === 'secret_question') {
                app.innerHTML = `
                    ${backHtml}
                    <h3><i class="fa-solid fa-key"></i> محطة التحقق السرية 🕵️‍♂️</h3>
                    <p class="subtitle">اكتبي الإجابة الصحيحة عشان تدخلي لصفحة الرسالة:</p>
                    <input type="text" id="secretInput" placeholder="اكتبي الإجابة هنا...">
                    <button class="btn btn-full" style="margin-top: 15px; background: var(--brand-color); color: #fff;" onclick="checkSecretAnswer()">تحقق وتابع 🔓</button>
                `;
            } else if (step === 'message') {
                // صفحة كتابة الرسالة أصبحت قبل الأخيرة
                app.innerHTML = `
                    ${backHtml}
                    <h3>اكتبيلي الي نفسك فيه</h3>
                    <div data-fs-success style="color: var(--brand-color); font-weight: bold; margin-bottom: 10px; font-size: 14px;"></div>
                    <form id="my-form" action="https://formspree.io/f/mgaooyqb" method="POST">
                        <!-- حقول خفية لجمع كل اختياراتها وإرسالها مع الرسالة -->
                        <input type="hidden" name="time" id="input_time">
                        <input type="hidden" name="place" id="input_place">
                        <input type="hidden" name="food" id="input_food">
                        <input type="hidden" name="drink" id="input_drink">
                        <input type="hidden" name="movieType" id="input_movieType">

                        <textarea name="love_message" data-fs-field placeholder="اكتبي رسالتك هنا يا قلبي..." required></textarea>
                        <span data-fs-error="love_message" style="color: red; font-size: 12px;"></span>

                        <button type="submit" data-fs-submit-btn class="btn btn-full" style="margin-top: 15px; background: var(--brand-color); color: #fff; font-weight: bold;" onclick="setTimeout(() => goToStep('summary'), 1500)">
                            <i class="fa-solid fa-paper-plane"></i> بس بقا بتكسف 💀
                        </button>
                    </form>
                `;
                
                setTimeout(() => {
                    if (window.formspree) {
                        window.formspree('initForm', { formElement: '#my-form', formId: 'mgaooyqb' });
                    }
                    document.getElementById('input_time').value = answers.time || 'غير محدد';
                    document.getElementById('input_place').value = answers.place || 'مصر المحروسة';
                    document.getElementById('input_food').value = answers.food.join(', ') || 'غير محدد';
                    document.getElementById('input_drink').value = answers.drink.join(', ') || 'غير محدد';
                    document.getElementById('input_movieType').value = answers.movieType || 'غير محدد';
                }, 100);
            } else if (step === 'summary') {
                // الصفحة الأخيرة أصبحت نتيجة الاختيارات ومعاها زرار اختبار جديد والعداد
                app.innerHTML = `
                    <h3><i class="fa-solid fa-clipboard-check"></i> ملخص خطة الخروجة يا هانم</h3>
                    <p class="subtitle">تم إرسال رسالتك واختياراتك بنجاح للبشمهندس!</p>
                    <div class="summary-box">
                        <p><i class="fa-solid fa-clock"></i> <strong>المعاد:</strong> <span>${answers.time || 'غير محدد'}</span></p>
                        <p><i class="fa-solid fa-location-dot"></i> <strong>المكان:</strong> <span>${answers.place || 'غير محدد'}</span></p>
                        <p><i class="fa-solid fa-utensils"></i> <strong>الأكل:</strong> <span>${answers.food.join('، ') || 'غير محدد'}</span></p>
                        <p><i class="fa-solid fa-wine-glass"></i> <strong>المشروب:</strong> <span>${answers.drink.join('، ') || 'غير محدد'}</span></p>
                        <p><i class="fa-solid fa-film"></i> <strong>نوع الفيلم:</strong> <span>${answers.movieType || 'غير محدد'}</span></p>
                    </div>

                    <div id="restartSection">
                        <button class="btn btn-full" style="background: var(--brand-color); color: #fff;" onclick="startCountdown()">
                            <i class="fa-solid fa-rotate-right"></i> اختبار جديد 🔄
                        </button>
                    </div>
                `;
            }
        }

        function startCountdown() {
            const restartSection = document.getElementById('restartSection');
            let timeLeft = 120; // دقيقتين (120 ثانية)

            restartSection.innerHTML = `
                <div class="timer-box">
                    <p style="color: var(--muted-color); font-weight: bold; margin: 0; font-size: 14px;">انا مش ساحر اترزعي في بيتكم 🛑</p>
                    <div class="timer-display" id="timerCount">02:00</div>
                    <p style="color: var(--text-color); font-size: 11px; margin: 0;">يُرجى الانتظار حتى يفتح الاختبار الجديد...</p>
                </div>
            `;

            countdownInterval = setInterval(() => {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                
                let formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                const timerDisplay = document.getElementById('timerCount');
                if (timerDisplay) {
                    timerDisplay.textContent = formattedTime;
                }

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    // إعادة تعيين البيانات والرجوع للبداية
                    answers = { food: [], drink: [], movieType: '' };
                    historyStack = [];
                    goToStep('start');
                }
            }, 1000);
        }

        function checkPlace(placeName) {
            if (placeName === 'مصر') {
                answers.place = 'مصر';
                goToStep('food');
            } else if (placeName === 'باريس') {
                alert('✈️ باريس إيه مش هينفع جواز سفري لسه خلصان ! خلينا في مصر !');
            } else if (placeName === 'المانيا') {
                alert('🇩🇪 ألمانيا ايه وباباك قاعد مستنيني ع الباب! اقعدي اتنيلي اختاري مصر!');
            } else if (placeName === 'تركيا') {
                alert('🧔🏻 لا ياما الميزانية على قدنا اخرك معايا مصر المحروسة!');
            }
        }

        function toggleFood(btn, foodName) {
            if (answers.food.includes(foodName)) {
                answers.food = answers.food.filter(item => item !== foodName);
                btn.classList.remove('selected');
            } else {
                answers.food.push(foodName);
                btn.classList.add('selected');
                if (answers.food.length > 1) {
                    alert('وترجعي تقولي تخنت الدايات يااااا🤬ا');
                }
            }
        }

        function validateFood() {
            if (answers.food.length === 0) {
                alert('⚠️ لازم تختاري أكلة واحدة على الأقل عشان الجوع كافر!');
            } else {
                goToStep('drink');
            }
        }

        function toggleDrink(btn, drinkName) {
            if (answers.drink.includes(drinkName)) {
                answers.drink = answers.drink.filter(item => item !== drinkName);
                btn.classList.remove('selected');
            } else {
                answers.drink.push(drinkName);
                btn.classList.add('selected');
                if (answers.drink.length > 1) {
                    alert('ايي يمااا الدايات فين 🤨');
                }
            }
        }

        function validateDrink() {
            if (answers.drink.length === 0) {
                alert('⚠️ اختاري مشروب واحد على الأقل عشان تروي عطشك!');
            } else {
                alert(`🍹 اختياري ممتاز (${answers.drink.join(', ')})، بالهنا والشفا يا ست الكل!`);
                goToStep('cinema');
            }
        }

        function handleMovieSelection(movieChoice) {
            answers.movieType = movieChoice;
            if (movieChoice === 'رعب') {
                let pledgeConfirmed = confirm("⚠️ تعهد رسمي: هل تتعهدين إنك مش هتخاف، ومش هتخرجي من الصالة، ومش هتعلي صوتك بالصراخ؟ اضغطي موافق للإقرار والتعهد!");
                if (pledgeConfirmed) {
                    goToStep('secret_question');
                } else {
                    alert('❌ طالما مش قد الرعب اختاري نوع تاني ي شاطرة! 😉');
                }
            } else {
                goToStep('secret_question');
            }
        }

        function checkSecretAnswer() {
            const val = document.getElementById('secretInput').value.trim();
            if (val === 'ياااه') {
                // الانتقال لصفحة كتابة الرسالة (قبل الأخيرة)
                goToStep('message');
            } else {
                alert('❌ إجابة غلط يا روح.. ركزي واكتبي الإجابة الصح والا مش هتمشي الخطوة دي! 😉');
            }
        }

        renderStep('start');
    </script>
